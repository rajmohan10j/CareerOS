<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerOS</title>
    <link rel="stylesheet" href="../styles/popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">CareerOS</h1>
        <span class="version">v0.1.0</span>
      </header>

      <section class="status-section">
        <div class="status-row">
          <span class="label">Backend</span>
          <span id="backendStatus" class="status-indicator checking">Checking...</span>
        </div>
        <div class="status-row">
          <span class="label">Version</span>
          <span id="backendVersion" class="value">—</span>
        </div>
        <div class="status-row">
          <span class="label">Mode</span>
          <span id="backendMode" class="value">—</span>
        </div>
      </section>

      <div id="errorDetail" class="error-detail hidden"></div>

      <section class="detection-section">
        <button id="detectFieldsBtn" class="detect-btn">Detect Form Fields</button>
        <div id="fieldSummary" class="field-summary hidden">
          <span class="label">Fields detected</span>
          <span id="fieldCount" class="field-count">0</span>
        </div>

        <div id="fieldDebug" class="field-debug hidden">
          <button id="toggleDebugBtn" class="debug-toggle">Show field details</button>
          <div id="debugContent" class="debug-content hidden"></div>
        </div>
      </section>

      <section id="mappingSection" class="mapping-section hidden">
        <button id="mapFieldsBtn" class="map-btn">Map Fields to Profile</button>
        <div id="mappingSummary" class="mapping-summary hidden"></div>
        <div id="mappingDebug" class="field-debug hidden">
          <button id="toggleMappingBtn" class="debug-toggle">Show proposed mappings</button>
          <div id="mappingContent" class="debug-content hidden"></div>
        </div>
      </section>

      <section id="approvalSection" class="approval-section hidden">
        <h2 class="approval-title">Approve Mappings</h2>
        <button id="selectAllSafeBtn" class="safe-btn">Select All Safe</button>
        <button id="resetApprovalsBtn" class="reset-btn">Reset All</button>
        <div id="approvalSummary" class="approval-summary-area hidden"></div>
        <div id="previewContent" class="preview-content"></div>
        <button id="fillFieldsBtn" class="fill-btn" disabled>Fill Approved Fields</button>
        <div id="fillResult" class="fill-result hidden"></div>
      </section>

      <footer class="footer">
        <a href="#" id="openOptionsLink">Settings</a>
      </footer>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
