name: Extension Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "browser-extension/**"
      - ".github/workflows/extension-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "browser-extension/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: browser-extension/package.json

      - name: Install dependencies (for test runner)
        run: npm ci

      - name: Run all extension test files
        run: |
          total=0
          for f in tests/*.test.js; do
            echo "Running $f..."
            node --experimental-vm-modules "$f"
            total=$((total + $?))
          done
          echo "All extension test suites completed."

      - name: Test summary
        run: echo "Extension tests completed."
